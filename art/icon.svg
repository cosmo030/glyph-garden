<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!--
    Glyph Garden icon: a firefly glow drawn as character tiles, the same way the Meadow draws it.
    A 5x5 grid of tiles (18 units wide, 6 apart). The tile colour fades with distance from the
    middle, so the glow is round; the corners stay empty. Original artwork. It is the source for
    public/icon/*.png (run `npm run icons`), so edit this file and regenerate rather than the PNGs.
  -->
  <rect width="128" height="128" rx="28" fill="#060b16" />
  <g fill="#d6ea5a">
    <!-- outer ring: the faintest tiles, no corners -->
    <rect x="31" y="7" width="18" height="18" rx="5" opacity="0.16" />
    <rect x="55" y="7" width="18" height="18" rx="5" opacity="0.2" />
    <rect x="79" y="7" width="18" height="18" rx="5" opacity="0.16" />
    <rect x="31" y="103" width="18" height="18" rx="5" opacity="0.16" />
    <rect x="55" y="103" width="18" height="18" rx="5" opacity="0.2" />
    <rect x="79" y="103" width="18" height="18" rx="5" opacity="0.16" />
    <rect x="7" y="31" width="18" height="18" rx="5" opacity="0.16" />
    <rect x="7" y="55" width="18" height="18" rx="5" opacity="0.2" />
    <rect x="7" y="79" width="18" height="18" rx="5" opacity="0.16" />
    <rect x="103" y="31" width="18" height="18" rx="5" opacity="0.16" />
    <rect x="103" y="55" width="18" height="18" rx="5" opacity="0.2" />
    <rect x="103" y="79" width="18" height="18" rx="5" opacity="0.16" />
    <!-- middle ring, corners of the 3x3 a little dimmer than its sides -->
    <rect x="31" y="31" width="18" height="18" rx="5" opacity="0.42" />
    <rect x="55" y="31" width="18" height="18" rx="5" opacity="0.64" />
    <rect x="79" y="31" width="18" height="18" rx="5" opacity="0.42" />
    <rect x="31" y="55" width="18" height="18" rx="5" opacity="0.64" />
    <rect x="79" y="55" width="18" height="18" rx="5" opacity="0.64" />
    <rect x="31" y="79" width="18" height="18" rx="5" opacity="0.42" />
    <rect x="55" y="79" width="18" height="18" rx="5" opacity="0.64" />
    <rect x="79" y="79" width="18" height="18" rx="5" opacity="0.42" />
  </g>
  <!-- the firefly: a solid pale tile with a bright dot -->
  <rect x="55" y="55" width="18" height="18" rx="5" fill="#f4ffb0" />
  <circle cx="64" cy="64" r="4.5" fill="#ffffff" />
</svg>
