<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>New Tab</title>
  </head>
  <body>
    <canvas id="stage" aria-hidden="true"></canvas>

    <div class="ui">
      <nav class="species" aria-label="Animals"></nav>
      <button class="tweaks-btn" type="button" aria-expanded="false" aria-controls="tweaks">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path d="M2 4h7M12 4h2M2 12h2M7 12h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
          <circle cx="10.5" cy="4" r="1.6" fill="none" stroke="currentColor" stroke-width="1.4" />
          <circle cx="5.5" cy="12" r="1.6" fill="none" stroke="currentColor" stroke-width="1.4" />
        </svg>
        Tweaks
      </button>

      <main class="center">
        <h1 class="greeting"></h1>
        <form class="search" role="search">
          <svg class="search-icon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
            <circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.5" />
            <path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          <input
            name="q"
            type="search"
            placeholder="Search the web…"
            autocomplete="off"
            aria-label="Search the web"
            autofocus
          />
          <button type="submit" aria-label="Search">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <path
                d="M8 13V3M3.5 7.5 8 3l4.5 4.5"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </form>
      </main>

      <div class="hint"></div>
      <div class="toast" role="status" aria-live="polite"></div>
    </div>

    <aside id="tweaks" class="tweaks" hidden></aside>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
